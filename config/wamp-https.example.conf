# Replace LAPTOP_IP and LAN_CIDR using the real hotspot interface, then save as
# config/wamp-https.local.conf. Include that file from Apache only after creating certificates.
# This dedicated port does not expose WAMP aliases, phpMyAdmin or Python.
Listen LAPTOP_IP:8443
<VirtualHost LAPTOP_IP:8443>
    ServerName acceso.ada.test
    DocumentRoot "C:/wamp64/www/UtenticacionADA/public"
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "C:/wamp64/www/UtenticacionADA/storage/private/tls/site.pem"
    SSLCertificateKeyFile "C:/wamp64/www/UtenticacionADA/storage/private/tls/site-key.pem"
    <LocationMatch "^/(phpmyadmin|adminer|phpsysinfo)(/|$)">
        Require all denied
    </LocationMatch>
    <Directory "C:/wamp64/www/UtenticacionADA/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require ip LAN_CIDR
        php_value upload_max_filesize 8M
        php_value post_max_size 28M
        php_value max_file_uploads 3
        php_flag display_errors Off
    </Directory>
</VirtualHost>
