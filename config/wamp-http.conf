# Vista local de desarrollo. Para telefono, usar HTTPS y un nombre LAN estable.
Listen 127.0.0.1:8088
<VirtualHost 127.0.0.1:8088>
    ServerName localhost
    DocumentRoot "C:/wamp64/www/UtenticacionADA/public"
    <Directory "C:/wamp64/www/UtenticacionADA/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
        php_value upload_max_filesize 8M
        php_value post_max_size 28M
        php_value max_file_uploads 3
        php_flag display_errors Off
    </Directory>
</VirtualHost>
